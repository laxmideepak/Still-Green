# Exact, hash-checked versions of the packages Stillgreen needs.
#
# ./sg-local installs these into a private folder (.venv) the first time it
# runs, so a fresh computer needs only Python 3.9 or newer. pip checks every
# download against the hashes below.
#
# To update (then run the tests on Python 3.9 and a current Python):
#   uv pip compile --universal --generate-hashes --python-version 3.9 \
#     --no-header --no-annotate requirements.in -o requirements.lock
# where requirements.in holds the ranges listed in pyproject.toml:
#   websockets>=14,<16 ; python_version < "3.10"
#   websockets>=16,<17 ; python_version >= "3.10"
#   truststore>=0.10,<0.11 ; python_version >= "3.10"
