<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="title desc">
  <title id="title">Stillgreen</title>
  <desc id="desc">Stillgreen helps keep your Slack status green on your schedule. A status pill labeled Sample reads: Active, until 5:00 PM.</desc>
  <defs>
    <clipPath id="frame"><rect x="0.5" y="0.5" width="1279" height="399" rx="20"/></clipPath>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#f0f0f0"/>
    </pattern>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#16a34a" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#16a34a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#a3e635"/>
      <stop offset="1" stop-color="#10b981"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000000" flood-opacity="0.06"/>
    </filter>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1280" height="400" fill="#ffffff"/>
    <rect width="1280" height="400" fill="url(#dots)"/>
    <rect width="1280" height="400" fill="url(#fade)"/>
    <circle cx="1010" cy="200" r="300" fill="url(#glow)"/>
  </g>
  <rect x="0.5" y="0.5" width="1279" height="399" rx="20" fill="none" stroke="#e5e5e5"/>

  <g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <!-- Mark and name -->
    <g transform="translate(72 80) scale(0.875)">
      <rect width="64" height="32" rx="16" fill="url(#mark)"/>
      <circle cx="46" cy="16" r="12.5" fill="#fff"/>
      <path d="M39.38 14.31A2.13 2.13 0 0 1 43.63 14.31" fill="none" stroke="#10b981" stroke-width="1.88" stroke-linecap="round"/>
      <path d="M48.38 14.31A2.13 2.13 0 0 1 52.63 14.31" fill="none" stroke="#10b981" stroke-width="1.88" stroke-linecap="round"/>
      <path d="M39.75 17H52.25A6.25 6.25 0 0 1 39.75 17Z" fill="#10b981"/>
    </g>
    <text x="142" y="104" fill="#0a0a0a" font-size="26" font-weight="600" letter-spacing="-0.6">Stillgreen</text>

    <!-- Tagline -->
    <text x="70" y="200" fill="#0a0a0a" font-size="44" font-weight="700" letter-spacing="-1.6">Helps keep your Slack status</text>
    <text x="70" y="256" fill="#0a0a0a" font-size="44" font-weight="700" letter-spacing="-1.6">green on your schedule<tspan fill="#15803d">.</tspan></text>
    <text x="72" y="314" fill="#525252" font-size="20" letter-spacing="-0.2">Runs on your own computer or server. Free and open source.</text>

    <!-- Stylised Slack profile card -->
    <g filter="url(#shadow)">
      <rect x="836" y="104" width="360" height="192" rx="16" fill="#ffffff"/>
    </g>
    <rect x="836.5" y="104.5" width="359" height="191" rx="15.5" fill="none" stroke="#e5e5e5"/>

    <rect x="868" y="136" width="64" height="64" rx="14" fill="#dcfce7"/>
    <circle cx="900" cy="160" r="11" fill="#bbf7d0"/>
    <path d="M879 200 C 881 184 890 178 900 178 C 910 178 919 184 921 200 Z" fill="#bbf7d0"/>
    <circle cx="930" cy="198" r="11" fill="#ffffff"/>
    <circle cx="930" cy="198" r="7.5" fill="#16a34a"/>

    <rect x="956" y="146" width="148" height="14" rx="7" fill="#e5e5e5"/>
    <rect x="956" y="172" width="104" height="10" rx="5" fill="#f4f4f5"/>
    <rect x="956" y="190" width="132" height="10" rx="5" fill="#f4f4f5"/>

    <!-- Status pill -->
    <rect x="868" y="234" width="234" height="36" rx="18" fill="#f0fdf4" stroke="#bbf7d0"/>
    <circle cx="890" cy="252" r="5" fill="#16a34a"/>
    <text x="904" y="257.5" fill="#15803d" font-size="15" font-weight="600">Active<tspan fill="#525252" font-weight="500"> · until 5:00 PM</tspan></text>
    <text x="1114" y="256.5" fill="#737373" font-size="12" font-weight="600" letter-spacing="0.2">Sample</text>
  </g>
</svg>
