<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="600" viewBox="0 0 1600 600" role="img" aria-labelledby="title desc">
  <title id="title">Stillgreen — your green dot, on your schedule</title>
  <desc id="desc">An editorial banner showing the Stillgreen wordmark and a live presence card for a Slack workspace.</desc>

  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f9f2"/>
      <stop offset="0.55" stop-color="#eef5e9"/>
      <stop offset="1" stop-color="#e6f0e1"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#22bd77" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#22bd77" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.94"/>
      <stop offset="1" stop-color="#f9fcf6" stop-opacity="0.86"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#dce8d8" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#14231a" flood-opacity="0.10"/>
    </filter>
    <style>
      .sans { font-family: Inter, "Helvetica Neue", Helvetica, Arial, sans-serif; }
      .ink { fill: #14231a; }
      .muted { fill: #5d6d61; }
      .green { fill: #0e7a4d; }
      .micro { font-size: 13px; font-weight: 650; letter-spacing: 2.6px; }
    </style>
  </defs>

  <rect width="1600" height="600" fill="url(#paper)"/>
  <rect width="1600" height="600" fill="url(#grid)" opacity="0.48"/>
  <circle cx="1490" cy="30" r="420" fill="url(#glow)"/>
  <circle cx="1490" cy="30" r="300" fill="none" stroke="#c7d8c2" stroke-width="1" opacity="0.65"/>
  <circle cx="1490" cy="30" r="210" fill="none" stroke="#c7d8c2" stroke-width="1" opacity="0.5"/>
  <path d="M920 92V508" stroke="#cbdac6" stroke-width="1" stroke-dasharray="2 8" opacity="0.9"/>

  <g class="sans">
    <g>
      <rect x="84" y="66" width="58" height="58" rx="19" fill="#fbfdf8" stroke="#14231a" stroke-width="2"/>
      <circle cx="113" cy="95" r="17" fill="none" stroke="#14231a" stroke-width="1" opacity="0.28"/>
      <circle cx="113" cy="95" r="9.5" fill="#22bd77"/>
    </g>
    <text x="162" y="108" class="ink" font-size="34" font-weight="700" letter-spacing="-1.4">stillgreen</text>

    <circle cx="92" cy="186" r="5" fill="#22bd77"/>
    <text x="108" y="191" class="muted micro">SELF-HOSTED · ALWAYS ON · NO TELEMETRY</text>

    <text x="82" y="286" class="ink" font-size="78" font-weight="700" letter-spacing="-4.2">Your green dot,</text>
    <text x="82" y="370" class="ink" font-size="78" font-weight="700" letter-spacing="-4.2">on your schedule<tspan fill="#0e7a4d">.</tspan></text>

    <text x="84" y="428" class="muted" font-size="22" letter-spacing="-0.2">Slack presence that runs on your own cloud.</text>
    <text x="84" y="460" class="muted" font-size="22" letter-spacing="-0.2">Close the laptop. The dot stays green.</text>

    <g>
      <rect x="84" y="496" width="150" height="38" rx="19" fill="#ffffff" fill-opacity="0.64" stroke="#cddcca"/>
      <text x="159" y="520" text-anchor="middle" class="ink" font-size="13" font-weight="650">24/7 daemon</text>
      <rect x="246" y="496" width="174" height="38" rx="19" fill="#ffffff" fill-opacity="0.64" stroke="#cddcca"/>
      <text x="333" y="520" text-anchor="middle" class="ink" font-size="13" font-weight="650">Vercel dashboard</text>
      <rect x="432" y="496" width="118" height="38" rx="19" fill="#ffffff" fill-opacity="0.64" stroke="#cddcca"/>
      <text x="491" y="520" text-anchor="middle" class="ink" font-size="13" font-weight="650">No relay</text>
    </g>

    <text x="84" y="576" class="muted micro" opacity="0.72">BUILT FOR PEOPLE WHO CLOSE THEIR LAPTOPS</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="960" y="76" width="556" height="448" rx="30" fill="url(#card)" stroke="#d2e0ce"/>
    <rect x="960" y="76" width="556" height="448" rx="30" fill="none" stroke="#ffffff" stroke-opacity="0.55"/>
  </g>

  <g class="sans">
    <text x="1004" y="132" class="ink" font-size="22" font-weight="700" letter-spacing="-0.7">Fieldwork</text>
    <text x="1004" y="156" class="muted" font-size="14">Product workspace</text>

    <rect x="1368" y="110" width="112" height="34" rx="17" fill="#e6f4ea" stroke="#c4e3ce"/>
    <circle cx="1388" cy="127" r="4" fill="#22bd77"/>
    <text x="1400" y="132" class="green" font-size="13" font-weight="650">Scheduled</text>

    <circle cx="1088" cy="278" r="72" fill="none" stroke="#dfeadd" stroke-width="12"/>
    <circle cx="1088" cy="278" r="72" fill="none" stroke="#22bd77" stroke-width="12" stroke-linecap="round" stroke-dasharray="317 453" transform="rotate(-90 1088 278)"/>
    <text x="1088" y="282" text-anchor="middle" class="ink" font-size="27" font-weight="700" letter-spacing="-1">Active</text>
    <text x="1088" y="304" text-anchor="middle" class="muted" font-size="12" letter-spacing="0.6">TODAY</text>

    <text x="1204" y="244" class="ink" font-size="36" font-weight="700" letter-spacing="-1.6">Online</text>
    <text x="1204" y="274" class="muted" font-size="14">The daemon holds the session open</text>
    <text x="1204" y="296" class="muted" font-size="14">and re-checks presence every minute.</text>

    <text x="1204" y="340" class="muted" font-size="11" font-weight="650" letter-spacing="1.8">NEXT CHANGE</text>
    <text x="1204" y="368" class="ink" font-size="20" font-weight="650">17:00 today</text>

    <g>
      <rect x="1004" y="414" width="48" height="9" rx="4.5" fill="#0e7a4d"/>
      <rect x="1064" y="414" width="48" height="9" rx="4.5" fill="#0e7a4d"/>
      <rect x="1124" y="414" width="48" height="9" rx="4.5" fill="#0e7a4d"/>
      <rect x="1184" y="414" width="48" height="9" rx="4.5" fill="#0e7a4d"/>
      <rect x="1244" y="414" width="48" height="9" rx="4.5" fill="#0e7a4d"/>
      <rect x="1304" y="414" width="48" height="9" rx="4.5" fill="#dfeadd"/>
      <rect x="1364" y="414" width="48" height="9" rx="4.5" fill="#dfeadd"/>
      <text x="1028" y="446" text-anchor="middle" class="muted" font-size="11">M</text>
      <text x="1088" y="446" text-anchor="middle" class="muted" font-size="11">T</text>
      <text x="1148" y="446" text-anchor="middle" class="muted" font-size="11">W</text>
      <text x="1208" y="446" text-anchor="middle" class="muted" font-size="11">T</text>
      <text x="1268" y="446" text-anchor="middle" class="muted" font-size="11">F</text>
      <text x="1328" y="446" text-anchor="middle" class="muted" font-size="11">S</text>
      <text x="1388" y="446" text-anchor="middle" class="muted" font-size="11">S</text>
    </g>

    <text x="1004" y="490" class="muted" font-size="12">40h this week · Europe/Amsterdam</text>

    <g>
      <rect x="1368" y="470" width="112" height="34" rx="17" fill="#14231a"/>
      <text x="1424" y="492" text-anchor="middle" fill="#f3f7ef" font-size="12" font-weight="650">Open dashboard</text>
    </g>
  </g>
</svg>
