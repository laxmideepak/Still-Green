name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python tests (${{ matrix.python }})
    # GitHub has no Python 3.9 build for the newest Ubuntu image, so the
    # 3.9 job runs on Ubuntu 24.04.
    runs-on: ${{ matrix.python == '3.9' && 'ubuntu-24.04' || 'ubuntu-latest' }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 3.9 is the oldest version pyproject.toml allows (it is the python3
        # that comes with macOS). 3.10 is the first with truststore and the
        # lowest for the websockets version pinned for 3.10+.
        python: ["3.9", "3.10", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install dependencies
        # The same pinned, hash-checked packages ./sg-local installs. pytest
        # and pytest-xdist are not in the lock, so they come in a second step.
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install pytest pytest-xdist
      - name: Run unit and end-to-end tests
        # The tests mostly wait (sockets, timers), so 16 workers on a 4-core
        # runner cut ~100 s to ~20 s.
        run: python -m pytest -q -n 16 --dist worksteal

  macos:
    # A clean checkout, as on a new Mac: nothing is installed with pip first.
    # ./sg-local must set itself up (.venv) from the Python it finds.
    name: macOS ${{ matrix.arch }} (Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # macos-latest is Apple Silicon (the macos-14 image no longer gets a
        # runner). GitHub retired the macos-13 Intel image, so Intel uses
        # macos-15-intel. Only three jobs: macOS runners are scarce, and extra
        # jobs waited in the queue for minutes and were sometimes cancelled
        # without ever getting a runner. "system" is Apple's own Python 3.9
        # (the new-Mac case), so a separate 3.9 job added nothing; Linux also
        # tests 3.9.
        include:
          - { os: macos-latest, arch: Apple Silicon, python: "3.12" }
          - { os: macos-latest, arch: Apple Silicon, python: system }
          - { os: macos-15-intel, arch: Intel, python: system }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        if: matrix.python != 'system'
        with:
          python-version: ${{ matrix.python }}
      - name: Choose the Python the launcher will find
        run: |
          if [ "${{ matrix.python }}" = system ]; then
            # Only Apple's own /usr/bin/python3, like a new Mac with the
            # command line developer tools.
            echo "SMOKE_PATH=/usr/bin:/bin:/usr/sbin:/sbin" >> "$GITHUB_ENV"
          else
            echo "SMOKE_PATH=$(dirname "$(command -v python)"):/usr/bin:/bin:/usr/sbin:/sbin" >> "$GITHUB_ENV"
          fi
      - name: Clean setup (sg-local --version installs what it needs)
        run: |
          test ! -e .venv
          PATH="$SMOKE_PATH" ./sg-local --version
          test -x .venv/bin/python
          .venv/bin/python --version
      - name: Second run prints nothing extra
        run: |
          PATH="$SMOKE_PATH" ./sg-local --version 2> stderr.txt
          if [ -s stderr.txt ]; then cat stderr.txt; exit 1; fi
      - name: sg-local doctor
        env:
          # Keep these settings out of the runner's home folder.
          SG_LOCAL_CONFIG_DIR: ${{ runner.temp }}/sg-config
          SG_LOCAL_STATE_DIR: ${{ runner.temp }}/sg-state
        run: PATH="$SMOKE_PATH" ./sg-local doctor
      - name: Install pytest into the private environment
        run: .venv/bin/python -m pip install --disable-pip-version-check pytest pytest-xdist
      - name: Run unit and end-to-end tests
        # macOS runners have 3-4 cores; 8 workers keep it fast without
        # starving the timing-based tests.
        run: .venv/bin/python -m pytest -q -n 8 --dist worksteal

  browser:
    name: Type check, build and browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      # The browser tests start the real daemon and fake Slack from tests/e2e.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install dependencies
        run: |
          npm ci
          python -m pip install --require-hashes -r requirements.lock
      # Full Chromium, not only the headless shell: the extension test loads
      # the unpacked extension, which the headless shell cannot do.
      # Not cached: restoring the browser still needs its system libraries,
      # and installing those alone took longer (44 s) than everything (18 s).
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Type check
        run: npx tsc --noEmit
      - name: Logo mood unit tests
        run: npm run test:unit
      - name: Build the dashboard and run the browser tests
        run: npm run test:e2e
