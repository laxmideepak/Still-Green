[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "slack-green-local"
version = "0.1.1"
description = "Personal, local Slack presence daemon (slack.green-style, self-hosted)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "websockets>=14",
    # Use the operating system's certificates (macOS Keychain, Windows store,
    # Linux system bundle). Needs Python 3.10+; sg_local/tls.py falls back
    # without it.
    "truststore>=0.10; python_version >= '3.10'",
]

[project.urls]
Homepage = "https://github.com/laxmideepak/Still-Green"

[project.scripts]
sg-local = "sg_local.cli:main"

[tool.setuptools.packages.find]
include = ["sg_local*"]

[tool.setuptools.package-data]
sg_local = ["static/*"]
