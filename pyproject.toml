[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "slack-green-local"
version = "0.1.0"
description = "Personal, local Slack presence daemon (slack.green-style, self-hosted)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["websockets>=14"]

[project.urls]
Homepage = "https://github.com/laxmideepak/slack"

[project.scripts]
sg-local = "sg_local.cli:main"

[tool.setuptools.packages.find]
include = ["sg_local*"]

[tool.setuptools.package-data]
sg_local = ["static/*"]
