# Stillgreen on Fly.io (paid, about $2-3 a month; no free plan for new accounts).
#
#   fly launch --copy-config --no-deploy --name <your-app-name>
#   fly volumes create stillgreen_data --size 1
#   fly deploy
#   fly ssh console -C "sg-local web --show-code"
#
# Fly gives the app HTTPS at https://<your-app-name>.fly.dev.
app = "stillgreen-change-me"
primary_region = "iad"

[build]

[env]
  SG_LOCAL_WEB_PORT = "8765"
  # Count wrong access codes per real visitor (from Fly-Client-IP).
  SG_LOCAL_TRUSTED_PROXY = "fly"

[mounts]
  source = "stillgreen_data"
  destination = "/data"

[http_service]
  internal_port = 8765
  force_https = true
  # The daemon must keep its Slack connection open, so never stop it.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/api/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
