<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Stillgreen</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="head">
      <span class="mark" aria-hidden="true"><i></i></span>
      <div class="headText">
        <strong>stillgreen</strong>
        <span id="status" class="status statusIdle">Not checked</span>
      </div>
    </header>

    <main>
      <p class="lede">
        Reads the Slack session already open in this browser and sends it only to the
        daemon URL you set below, normally your own machine.
      </p>

      <label class="field">
        <span>Daemon URL</span>
        <input id="daemonUrl" type="text" inputmode="url" spellcheck="false" autocomplete="off" placeholder="http://127.0.0.1:8765" />
      </label>

      <label class="field">
        <span>Access code</span>
        <input id="bridgeCode" type="password" spellcheck="false" autocomplete="off" placeholder="SG-…" />
      </label>

      <button id="capture" class="primary" type="button">
        Capture from Slack
        <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M2 8h11M9 4l4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>

      <p id="target" class="target"></p>

      <div id="results" class="results" hidden></div>

      <p id="hint" class="hint">
        Sign in at <a href="https://app.slack.com" target="_blank" rel="noreferrer">app.slack.com</a>
        first, then run a capture.
      </p>
    </main>

    <footer class="foot">
      <a href="https://stillgreen.vercel.app/dashboard" target="_blank" rel="noreferrer">Open dashboard ↗</a>
      <span>v1.0.0</span>
    </footer>

    <script src="popup.js"></script>
  </body>
</html>
